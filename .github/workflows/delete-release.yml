name: Удалить версию
# Удаляет неудачную версию (выпуск и метку) — запуск вручную: Actions → «Удалить версию» → Run workflow
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Метка версии, например v1.6.3'
        required: true
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Неверная метка: $TAG"; exit 1;; esac
          gh release delete "$TAG" --repo "${{ github.repository }}" --cleanup-tag --yes
