# Служебная проверка: можно ли у VK Видео взять трансляцию с самого начала (перемотка назад в эфире).
name: Проверка VK с начала

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Ссылка vk.com/video-…'
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Инструменты
        run: pip install -U "yt-dlp[default]" > /dev/null; yt-dlp --version
      - name: Проверка
        shell: bash
        env:
          U: ${{ inputs.url }}
        run: |
          set +e +o pipefail
          mkdir -p /tmp/probe && cd /tmp/probe
          yt-dlp -J "$U" > i.json 2> i.err; tail -3 i.err
          mask() { sed -E 's#/sig/[^/]+#/sig/…#; s#/srcIp/[^/]+#/srcIp/…#; s#/expires/[^/]+#/expires/…#'; }
          for FID in hls_live_ondemand-3 hls_live-3; do
            FU=$(jq -r --arg f "$FID" '.formats[] | select(.format_id == $f) | .url' i.json)
            H=$(jq -r --arg f "$FID" '.formats[] | select(.format_id == $f) | (.http_headers // {}) | to_entries | map("-H\n\(.key): \(.value)") | join("\n")' i.json)
            mapfile -t HA <<< "$H"
            echo "######## $FID" >> out.txt
            echo "url: $(echo "$FU" | mask)" >> out.txt
            curl -sL --max-time 20 "${HA[@]}" "$FU" -o p.m3u8
            echo "--- плейлист:" >> out.txt; sed -n '1,14p' p.m3u8 >> out.txt; echo "... последний: $(grep -v '^#' p.m3u8 | tail -1)" >> out.txt
            BASE="${FU%%\?*}"; BASE="${BASE%/*}"
            FIRST=$(grep -v '^#' p.m3u8 | grep . | head -1)
            case "$FIRST" in http*) SB="${FIRST%/*}";; *) SB="$BASE";; esac
            echo "--- кусочки по времени:" >> out.txt
            for T in t0.ts t2000.ts t60000.ts t600000.ts t3600000.ts; do
              code=$(curl -s -o seg.ts -w '%{http_code} %{size_download}' --max-time 20 "${HA[@]}" "$SB/$T")
              d=$(ffprobe -v error -show_entries format=duration:format=start_time -of csv=p=0 seg.ts 2>&1 | head -1)
              echo "$T → $code · $d" >> out.txt
            done
            echo "--- параметры плейлиста:" >> out.txt
            for P in "t=0" "offset=0" "start=0" "from=0" "time=0" "ts=0" "playback=0" "dvr=1" "start_time=0" "begin=0" "offset_p=0" "position=0"; do
              case "$FU" in *\?*) Q="$FU&$P";; *) Q="$FU?$P";; esac
              curl -sL --max-time 15 "${HA[@]}" "$Q" -o q.m3u8
              echo "$P → сегм. $(grep -c EXTINF q.m3u8), seq $(grep -oE 'MEDIA-SEQUENCE:[0-9]+' q.m3u8), первый $(grep -v '^#' q.m3u8 | grep . | head -1 | cut -c1-40)" >> out.txt
            done
          done
          rm -f *.ts *.m3u8 i.json
          cat out.txt
      - name: В ветку probe-vk
        run: |
          cd /tmp/probe && git init -q -b probe-vk && git config user.name probe && git config user.email probe@users.noreply.github.com
          git add out.txt i.err && git commit -q -m probe && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-vk
