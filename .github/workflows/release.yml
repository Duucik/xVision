# Сборка и выпуск xVision ITAA.
# Запускается сама, когда в ветку main попадает новая версия (поле "version" в package.json).
# Если релиз с такой версией уже есть — ничего не делает.
# Новая версия выходит как «пре-релиз»: её получает только Создатель (галочка «Тестовые версии» в настройках).
# Всем — после запуска «Выпустить для всех» (Actions → Выпустить для всех → Run workflow).
name: Сборка и выпуск

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Только собрать и проверить, без выпуска'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v5

      - name: Какая версия
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.check_only }}" = "true" ]; then
            echo "Проверочная сборка — без выпуска."
            echo "skip=0" >> "$GITHUB_OUTPUT"
          elif gh release view "v$V" > /dev/null 2>&1; then
            echo "Релиз v$V уже есть — собирать нечего."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -s license/public.key ]; then echo "::error::Нет license/public.key — запишите его лаунчером"; exit 1; fi

      - uses: actions/setup-node@v5
        if: steps.v.outputs.skip == '0'
        with:
          node-version: 20

      - name: Установка модулей
        if: steps.v.outputs.skip == '0'
        run: npm install --no-audit --no-fund

      - name: Подготовка (загрузчик видео, нейросети, библиотеки)
        if: steps.v.outputs.skip == '0'
        run: node prepare-build.js

      - name: Сборка установщика
        if: steps.v.outputs.skip == '0'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never

      - name: Проверка сборки (обновления и защита на месте)
        if: steps.v.outputs.skip == '0'
        run: node .github/check-build.js

      - name: Выпуск на GitHub
        if: steps.v.outputs.skip == '0' && inputs.check_only != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          node .github/release-notes.js > notes.md
          ls -la dist
          gh release create "v$V" \
            "dist/xVision-ITAA-Setup-$V.exe" \
            "dist/xVision-ITAA-Setup-$V.exe.blockmap" \
            "dist/latest.yml" \
            --title "xVision ITAA $V" --notes-file notes.md --prerelease

  # Mac: две сборки — для M1–M4 (arm64) и для Intel (x64). Без сертификата Apple: подпись ad-hoc.
  # Файлы .dmg добавляются в тот же релиз, что собрала Windows-часть.
  mac:
    needs: release
    if: needs.release.outputs.skip == '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.arch == 'x64' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Установка модулей
        run: npm install --no-audit --no-fund
      - name: Подготовка (загрузчик видео, нейросети)
        run: node prepare-build.js
      - name: Сборка для Mac (${{ matrix.arch }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
      - name: Проверка сборки
        shell: bash
        run: |
          ls -la dist
          APP=$(ls -d dist/mac*/*.app | head -1)
          test -f "$APP/Contents/Resources/app-update.yml" || echo "::warning::нет app-update.yml"
          test -x "$APP/Contents/Resources/bin/yt-dlp" || echo "::warning::нет загрузчика видео"
          codesign -dv "$APP" 2>&1 | head -3
          file "$APP/Contents/MacOS/"* | head -2
          # запуск: окно открывается, ffmpeg / загрузчик / нейросеть работают
          XV_SMOKE=1 "$APP/Contents/MacOS/xVision ITAA" > smoke.log 2>&1 &
          for i in $(seq 1 60); do grep -q SMOKE smoke.log && break; sleep 1; done
          grep SMOKE smoke.log || { echo "::error::программа не запустилась"; tail -30 smoke.log; exit 1; }
          if grep SMOKE smoke.log | grep -q ОШИБКА; then echo "::warning::$(grep SMOKE smoke.log)"; fi
      - name: В релиз
        if: inputs.check_only != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.release.outputs.version }}" dist/*.dmg --clobber
