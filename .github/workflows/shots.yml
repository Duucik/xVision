name: Снимки установщиков
on:
  push:
    branches: [shots]
permissions:
  contents: write
jobs:
  win:
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: node prepare-build.js
      - env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npx electron-builder --win --x64 --publish never
      - name: Снимки страниц
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          New-Item -ItemType Directory -Force out | Out-Null
          function Shot($n){ $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height; $g=[System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen(0,0,0,0,$bmp.Size); $bmp.Save("out/win-$n.png"); $g.Dispose(); $bmp.Dispose() }
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -PassThru
          $ws = New-Object -ComObject WScript.Shell
          Start-Sleep 10; $ws.AppActivate($p.Id) | Out-Null; Start-Sleep 1; Shot 1
          $ws.SendKeys('{ENTER}'); Start-Sleep 3; Shot 2
          $ws.AppActivate($p.Id) | Out-Null; $ws.SendKeys('{ENTER}'); Start-Sleep 1; Shot 3a; "after2 exited=$($p.HasExited)" | Out-File out/win-pre.txt; Start-Sleep 2; Shot 3
          $ws.AppActivate($p.Id) | Out-Null; $ws.SendKeys('{ENTER}'); Start-Sleep 2; Shot 4
          Start-Sleep 60; Shot 5
          "exited=$($p.HasExited) code=$($p.ExitCode)" | Out-File out/win-log.txt
          Get-Content "$env:TEMP\xvdark.log" -ErrorAction SilentlyContinue | Out-File -Append out/win-log.txt
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue | Where-Object { $_.LevelDisplayName -eq 'Error' } | Select-Object -First 5 | Format-List TimeCreated,ProviderName,Message | Out-File -Append out/win-log.txt
          Get-Process | Where-Object { $_.ProcessName -like 'xVision*' } | Stop-Process -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with: { name: win, path: out }
  mac:
    strategy:
      fail-fast: false
      matrix:
        eb: ['24', '26']
        node_arch: [arm64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, architecture: '${{ matrix.node_arch }}' }
      - run: npm install --no-audit --no-fund
      - run: node prepare-build.js
      - env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: |
          if [ "${{ matrix.eb }}" = 26 ]; then npm i --no-save electron-builder@26; fi
          npx electron-builder --version
          npx electron-builder --mac dmg --arm64 --publish never
      - name: Снимок окна установки
        run: |
          mkdir -p out
          node -p process.arch
          DMG=$(ls dist/*.dmg | head -1)
          hdiutil imageinfo "$DMG" | grep -i -E "format|partition|fs" | head
          hdiutil attach "$DMG" -noautoopen
          VOL=$(ls -d /Volumes/xVision* | head -1)
          ls -la "$VOL" "$VOL/.background" || true
          diskutil info "$VOL" | grep -i "file system" || true
          open "$VOL"; sleep 8
          osascript -e 'tell application "Finder" to close every window' || true; sleep 2
          open "$VOL"; sleep 8
          screencapture -x out/mac-${{ matrix.eb }}-light.png || true
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' || true
          sleep 3; screencapture -x out/mac-${{ matrix.eb }}-dark.png || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: 'mac-${{ matrix.eb }}', path: out }
  publish:
    needs: [mac]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: shots }
      - run: |
          git init -q o && cd o && cp -r ../shots/* . 2>/dev/null; ls -R
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm shots
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:shots-out
