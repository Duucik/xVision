name: Снимки установщиков
on:
  push:
    branches: [shots]
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: node prepare-build.js
      - env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npx electron-builder --win --x64 --publish never
      - name: Установка и запуск
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          New-Item -ItemType Directory -Force out | Out-Null
          function Shot($n){ $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height; $g=[System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen(0,0,0,0,$bmp.Size); $bmp.Save("out/$n.png"); $g.Dispose(); $bmp.Dispose() }
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $sm = [Environment]::GetFolderPath('Programs')
          Get-ChildItem $sm -Filter '*xVision*' | Select-Object Name | Out-File out/shortcuts.txt
          $app = Join-Path $env:LOCALAPPDATA 'Programs\xVision ITAA\xVision ITAA.exe'
          "app exists: $(Test-Path $app)" | Out-File -Append out/shortcuts.txt
          $data = Join-Path $env:APPDATA 'hockey-video-analysis-itaa'
          $p = Start-Process $app -PassThru; Start-Sleep 20; Shot 'run-gpu'
          Get-Content (Join-Path $data 'startup.log') | Out-File out/startup-gpu.txt
          "gpu-safe.json: $(Test-Path (Join-Path $data 'gpu-safe.json'))" | Out-File -Append out/startup-gpu.txt
          Get-Process | Where-Object { $_.ProcessName -like 'xVision*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 3
          $p = Start-Process $app -ArgumentList '--safe-gpu' -PassThru; Start-Sleep 20; Shot 'run-safe'
          Get-Content (Join-Path $data 'startup.log') | Out-File out/startup-safe.txt
          Get-Process | Where-Object { $_.ProcessName -like 'xVision*' } | Stop-Process -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with: { name: win, path: out }
  publish:
    needs: [win]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: shots }
      - run: |
          git init -q o && cd o && cp -r ../shots/* . 2>/dev/null; ls -R
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm shots
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:shots-out
